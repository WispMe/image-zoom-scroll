<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- <link rel="icon" type="image/svg+xml" href="/vite.svg" /> -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet" />
    <title>Image Zoom Scroll</title>
  </head>
  <body>
    <div id="app">
      <div id="scroll-element-1" class="h-[2000px]"></div>
      <div id="scroll-element-2" class="h-[2000px] -mt-[1500px]"></div>
      <div id="scroll-element-3" class="h-[2000px] -mt-[1500px]"></div>
      <div
        class="w-full h-screen left-0 top-0 fixed flex justify-center items-center"
      >
        <div
          class="bg-white rounded-md w-[80vw] h-[80vh] overflow-hidden relative"
        >
          <img
            id="chair-image-1"
            src="public/img_chair-1.png"
            class="w-full h-full object-cover rounded-md absolute left-0 top-0"
            alt="Chair 1"
          />
          <img
            id="chair-image-2"
            src="public/img_chair-2.png"
            class="w-full h-full object-cover rounded-md absolute left-0 top-0"
            alt="Chair 2"
          />
          <img
            id="chair-image-3"
            src="public/img_chair-3.png"
            class="w-full h-full object-cover rounded-md absolute left-0 top-0"
            alt="Chair 2"
          />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
